<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="description" content="한글 맞춤법 규정을 문제와 해설로 연습하는 오프라인 학습 앱">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>한글 맞춤법 고난도 연습</title>
<style>
:root{--bg:#faf8f4;--fg:#1f1d1a;--mut:#6b665e;--card:#fff;--line:#e2ddd3;--ac:#2f5d50;--acfg:#fff;--ok:#1f7a4d;--okbg:#e4f4ea;--no:#b3261e;--nobg:#fbe9e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--fg:#eee9df;--mut:#a39d91;--card:#211f1c;--line:#38342e;--ac:#7fbfa9;--acfg:#10201a;--ok:#6fd49f;--okbg:#17301f;--no:#ff8a80;--nobg:#3a1f1c}}
:root[data-theme="dark"]{--bg:#171614;--fg:#eee9df;--mut:#a39d91;--card:#211f1c;--line:#38342e;--ac:#7fbfa9;--acfg:#10201a;--ok:#6fd49f;--okbg:#17301f;--no:#ff8a80;--nobg:#3a1f1c}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:8px 0 4px}h2{font-size:1rem;margin:22px 0 8px;color:var(--mut)}
p.s{color:var(--mut);margin:0 0 8px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.btn{background:var(--ac);color:var(--acfg);border-color:var(--ac);border-radius:12px;padding:13px 18px;width:100%;margin-top:22px;font-weight:700}
.btn.g{background:var(--card);color:var(--fg);border-color:var(--line);margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.tag{font-size:.8rem;color:var(--ac);font-weight:700}
.q{font-size:1.05rem;margin:6px 0 12px;white-space:pre-line}
.o{display:block;width:100%;text-align:left;border-radius:10px;margin-top:8px;padding:11px 13px}
.o.ok{background:var(--okbg);border-color:var(--ok)}.o.no{background:var(--nobg);border-color:var(--no)}
.ex{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px;white-space:pre-line;font-size:.95rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:2.2rem;font-weight:800;text-align:center;margin:12px 0 0}
.mk{color:var(--no);font-weight:700}
.bo{background:var(--bg);border:1px dashed var(--ac);border-radius:8px;padding:10px 12px;margin:8px 0 12px;font-size:.93rem;white-space:pre-line}

/* 앱형 디자인 보강 */
body{background:radial-gradient(ellipse at 85% 0%,rgba(127,191,169,.16),transparent 34%),var(--bg)}
main{padding-top:max(26px,env(safe-area-inset-top,0px))}
h1{font-size:1.55rem;letter-spacing:-.045em;font-weight:850}
p.s{line-height:1.55}
.chip{transition:transform .15s ease,background .15s ease}
.chip:active,button:active{transform:scale(.98)}
.card{box-shadow:0 8px 28px rgba(35,45,38,.045)}
.btn{box-shadow:0 6px 16px rgba(47,93,80,.16)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
@media(min-width:520px){main{padding-top:34px}.card{padding:20px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const R=[
{c:"제1장 총칙",h:"제1항",y:"소리대로 적은(표음주의) 표기는?",n:"소리대로 적은(표음주의) 표기가 아닌 것은?",A:["가려워","더워","아름다워","웃으니","밥","꿈"],B:["꽃밭","맏이","젊음","늙어","늙지","늙는"],e:"표음주의는 [밥], [꿈]처럼 소리 나는 대로 적습니다. ‘아름다워’를 ‘아름답어’로 적으면 [아름다버]로 소리 나기 때문입니다.\n표의주의는 꽃밭[꼳빧], 맏이[마지], 젊음, ‘늙-’(늙어·늙지·늙는)처럼 발음과 달라도 형태소의 본래 모양을 밝혀 적습니다."},
{c:"제3장 소리에 관한 것",h:"제5항",y:"표기가 옳은 것은?",n:"표기가 옳지 않은 것은?",A:["깍두기","산뜻하다","소쩍새","국밥","갑자기","똑똑하다","쓱싹쓱싹","쌉쌀하다","몹시"],B:["깍뚜기>깍두기","산듯하다>산뜻하다","소적새>소쩍새","국빱>국밥","갑짜기>갑자기","똑독하다>똑똑하다","쓱삭쓱삭>쓱싹쓱싹","쌉살하다>쌉쌀하다","몹씨>몹시"],e:"한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 된소리로 적습니다(산뜻하다, 소쩍새: 두 모음 사이, ㄴ·ㄹ·ㅁ·ㅇ 뒤). 다만 ‘ㄱ, ㅂ’ 받침 뒤의 된소리는 언제나 일어나므로 표기에 반영하지 않습니다(깍두기, 국밥, 갑자기, 몹시).\n예외로 같거나 비슷한 음절이 반복되면 된소리를 표기에 반영합니다(똑똑하다, 쓱싹쓱싹, 쌉쌀하다)."},
{c:"제3장 소리에 관한 것",h:"제5항 예외",y:"‘ㄱ, ㅂ’ 받침 뒤 된소리를 표기에 반영하는 예외(같거나 비슷한 음절 반복)는?",n:"‘ㄱ, ㅂ’ 받침 뒤 된소리를 표기에 반영하는 예외에 해당하지 않는 것은?",A:["똑똑하다","쓱싹쓱싹","쌉쌀하다","딱딱하다","짭짤하다","싹싹하다"],B:["깍두기","국밥","갑자기","몹시","법석","학생"],e:"ㄱ, ㅂ 받침 뒤 된소리는 언제나 일어나므로 보통은 표기에 반영하지 않습니다(깍두기, 국밥, 갑자기). 다만 똑똑하다, 쓱싹쓱싹, 쌉쌀하다처럼 같거나 비슷한 음절이 반복되는 경우에만 예외적으로 된소리를 적습니다."},
{c:"제3장 소리에 관한 것",h:"제7항",y:"받침 표기가 옳은 것은?",n:"받침 표기가 옳지 않은 것은?",A:["돗자리","덧저고리","웃어른","무릇","얻어","얻으니"],B:["돋자리>돗자리","덛저고리>덧저고리","욷어른>웃어른","무룯>무릇","엇어>얻어","엇으니>얻으니"],e:"‘ㄷ’ 소리가 나는 받침(ㄷ, ㅅ, ㅆ, ㅈ, ㅊ, ㅌ, ㅎ) 중 ‘ㄷ’으로 적을 근거가 없는 것은 ‘ㅅ’으로 적습니다(돗자리, 덧저고리, 웃어른, 무릇).\n‘얻-’은 얻어[어더], 얻으니[어드니]처럼 활용형에서 ㄷ으로 적는 근거가 분명해 ㄷ 받침입니다."},
{c:"제3장 소리에 관한 것",h:"제29항",y:"표기가 옳은 것은?",n:"표기가 옳지 않은 것은?",A:["반짇고리","사흗날","숟가락","이튿날","섣달"],B:["반질고리>반짇고리","반짓고리>반짇고리","사흘날>사흗날","숫가락>숟가락","이틀날>이튿날"],e:"끝소리가 ㄹ인 말과 딴 말이 어울릴 때 ㄹ 소리가 ㄷ 소리로 나는 것은 ㄷ으로 적습니다(반질+고리→반짇고리, 사흘+날→사흗날, 술+가락→숟가락, 이틀+날→이튿날).\n제7항의 ‘ㅅ’은 ㄷ으로 적을 근거가 전혀 없을 때만 쓰므로 ‘숫가락’처럼 적지 않습니다."},
{c:"제3장 소리에 관한 것",h:"제10항",y:"표기가 옳은 것은?",n:"표기가 옳지 않은 것은?",A:["여자","익명","남녀","삼 년","금 한 냥","생산 연도","제작 연도","2025년도","노인"],B:["녀자>여자","닉명>익명","남여>남녀","삼 연>삼 년","금 한 양>금 한 냥","생산 년도>생산 연도","제작 년도>제작 연도","2025연도>2025년도","로인>노인"],e:"한자음 ‘녀, 뇨, 뉴, 니’가 단어 첫머리에 오면 두음법칙에 따라 ‘여, 요, 유, 이’로 적습니다(여자, 익명). ‘남녀’는 ‘녀’가 첫머리가 아니라 그대로 적습니다.\n의존 명사(‘냥(兩), 년(年)’)는 앞말과 한 단위를 이루므로 두음법칙을 적용하지 않습니다(삼 년, 2025년도). ‘연도’는 ‘생산 연도’처럼 명사일 때 두음법칙을 적용합니다."},
{c:"제4장 형태에 관한 것",h:"제15항 붙임 1",y:"표기가 옳은 것은?",n:"표기가 옳지 않은 것은?",A:["늘어나다","드러나다","늘어지다","늘어놓다","쓸어지다"],B:["느러나다>늘어나다","들어나다>드러나다","느러지다>늘어지다","느러놓다>늘어놓다"],e:"두 용언이 어울려 한 용언이 될 때 앞말의 본뜻이 유지되면 원형을 밝혀 적습니다(늘어나다, 쓸어지다). 본뜻에서 멀어지면 소리대로 적습니다(드러나다: ‘들다’의 본뜻이 유지되지 않음). 이 규정에는 표의주의와 표음주의가 공존합니다."},
{c:"제4장 형태에 관한 것",h:"제15항 붙임 1",y:"앞말의 본뜻이 유지되어 원형을 밝혀 적는 것은?",n:"앞말의 본뜻에서 멀어져 소리대로 적는 것은?",A:["늘어나다","늘어서다","늘어놓다","들어가다","들어서다","쓸어지다"],B:["드러나다","쓰러지다"],e:"‘늘어나다’는 ‘늘다’의 뜻이 유지되어 ‘느러나다’로 적지 않습니다. 반면 ‘드러나다’는 ‘들다’의 본뜻이 유지된다고 보기 어려워 소리 나는 대로 적습니다. 빗자루가 ‘쓸어진다’는 ‘쓸다’의 뜻이 유지되지만 ‘쓰러지다’는 본뜻에서 멀어진 말입니다."},
{c:"제4장 형태에 관한 것",h:"제19항",y:"어간의 원형을 밝혀 적은 말은?",n:"어간의 원형을 밝혀 적지 않은 말은?",A:["베풂","믿음","웃음","높이","깊이","길이","죽음"],B:["마감","마개","쓰레기","주검","귀머거리","도로","너머","너무","비로소","자주","부터","조차","나마"],e:"어간에 ‘-이’나 ‘-음/-ㅁ’이 붙어 명사가 되거나 ‘-이, -히’가 붙어 부사가 된 말은 원형을 밝혀 적습니다(베풀다+ㅁ→베풂).\n다만 ‘넘+어→너머’처럼 ‘-이, -음’ 이외의 모음으로 시작하는 접미사가 결합해 품사가 바뀐 말은 원형을 밝히지 않습니다. 명사로 바뀐 것(귀머거리, 마감, 마개, 쓰레기, 주검), 부사로 바뀐 것(너무, 도로, 비로소, 자주), 조사로 바뀌고 뜻이 달라진 것(나마, 부터, 조차)이 이에 속합니다."},
{c:"제4장 형태에 관한 것",h:"제19항",y:"표기가 옳은 것은?",n:"표기가 옳지 않은 것은?",A:["베풂","믿음","귀머거리","마감","마개","쓰레기","주검","도로"],B:["베품>베풂","믿엄>믿음","귀먹어리>귀머거리","막암>마감","막애>마개","쓸에기>쓰레기","죽엄>주검","돌오>도로"],e:"‘베풀다+ㅁ’처럼 ‘-음/-ㅁ’이 붙은 명사는 원형을 밝혀 ‘베풂’으로 적습니다. 반면 귀머거리, 마감(막+암), 마개, 쓰레기, 주검, 도로(돌+오)는 다른 모음의 접미사가 결합해 품사가 바뀐 말이라 원형을 밝혀 적지 않습니다."},
{c:"제4장 형태에 관한 것",h:"제40항 ①",y:"‘하’를 줄인 표기로 옳은 것은?",n:"‘하’를 줄인 표기로 옳지 않은 것은?",A:["간편케","다정타","달성케","연구토록","흔타"],B:["간편게>간편케","다정다>다정타","달성게>달성케","연구도록>연구토록","흔다>흔타"],e:"‘하’가 통째로 줄지 않고 ‘ㅎ’이 남아 뒤 음절의 첫소리와 어울려 거센소리가 되면 거센소리로 적습니다(간편하게→간편케, 다정하다→다정타). 앞 음절의 받침이 [ㄱ, ㄷ, ㅂ]이 아닐 때(ㄴ, ㅇ, 모음 등) 이렇게 됩니다."},
{c:"제4장 형태에 관한 것",h:"제40항 ②",y:"‘하’가 통째로 줄어든 표기로 옳은 것은?",n:"‘하’가 통째로 줄어든 표기로 옳지 않은 것은?",A:["생각건대","회상건대","못지않다","거북지","깨끗지","섭섭지","넉넉지"],B:["생각컨대>생각건대","회상컨대>회상건대","못치않다>못지않다","거북치>거북지","깨끗치>깨끗지","섭섭치>섭섭지","넉넉치>넉넉지"],e:"‘하’ 앞의 받침 소리가 [ㄱ, ㄷ, ㅂ]이면 ‘하’가 통째로 줄어듭니다. 생각·거북·넉넉은 ㄱ, 깨끗[깨끋]은 ㄷ, 섭섭은 ㅂ 소리이므로 ‘생각건대, 거북지, 깨끗지, 섭섭지’로 적습니다(못하지 않다→못지않다)."},
{c:"제4장 형태에 관한 것",h:"제40항 붙임 1",y:"‘ㅎ’이 어간의 끝소리로 굳어져 받침으로 적은 표기로 옳은 것은?",n:"‘ㅎ’이 어간의 끝소리로 굳어져 받침으로 적은 표기로 옳지 않은 것은?",A:["어떻다","그렇다","이렇다","저렇다"],B:["어떡다>어떻다","그럭다>그렇다","이럿다>이렇다","저럿다>저렇다"],e:"‘ㅎ’이 어간의 끝소리로 굳어진 것은 받침으로 적습니다(어떠하다→어떻다, 그러하다→그렇다). 붙임 2: 어간의 끝음절 ‘하’가 아주 줄 때(통째로 사라질 때)는 준 대로 적습니다."},
{c:"제5장 띄어쓰기",h:"제41항",y:"띄어쓰기가 옳은 것은?",n:"띄어쓰기가 옳지 않은 것은?",A:["꽃이","꽃만","꽃마저","오늘뿐이다","셋뿐이다","약속대로","너만큼","여기서부터입니다","사과하기는커녕"],B:["꽃 이>꽃이","꽃 만>꽃만","꽃 마저>꽃마저","오늘 뿐이다>오늘뿐이다","셋 뿐이다>셋뿐이다","약속 대로>약속대로","너 만큼>너만큼","여기서 부터입니다>여기서부터입니다","사과하기는 커녕>사과하기는커녕"],e:"조사는 하나의 단어지만 자립성이 없어 다른 말에 의존해서만 쓰이므로 앞말에 붙여 씁니다(꽃이: 주격 조사, 꽃만·꽃마저: 보조사, 꽃에서: 부사격 조사). 체언 뒤에서 한정의 뜻을 나타내는 ‘뿐’(오늘뿐이다, 셋뿐이다), 체언 뒤의 ‘대로, 만큼’도 조사입니다."},
{c:"제5장 띄어쓰기",h:"제42항",y:"띄어쓰기가 옳은 것은?",n:"띄어쓰기가 옳지 않은 것은?",A:["먹을 뿐이다","웃을 뿐이다","세 번 만에","십 년","생선 한 마리","삼 년","금 한 냥"],B:["먹을뿐이다>먹을 뿐이다","웃을뿐이다>웃을 뿐이다","세번 만에>세 번 만에","세 번만에>세 번 만에","십년>십 년","생선 한마리>생선 한 마리","삼년>삼 년","금 한냥>금 한 냥"],e:"의존 명사는 앞에 반드시 꾸며 주는 말(관형어)이 있어야 쓸 수 있지만 명사 기능을 하므로 단어로 취급해 띄어 씁니다(제42항). ‘뿐’이 용언의 관형사형 뒤에 오면 의존 명사라 띄어 씁니다(먹을 뿐이다, 웃을 뿐이다). ‘번, 만, 마리, 년, 냥’도 의존 명사입니다."},
{c:"제5장 띄어쓰기",h:"제47항",y:"보조 용언을 붙여 써도 허용되는 것은?",n:"보조 용언을 붙여 쓸 수 없고 반드시 띄어 써야 하는 것은?",A:["깨뜨려 버렸다","읽어 보았다","먹어 두었다","올 듯하다","할 만하다","써 보았다"],B:["덤벼들어 보아라","떠내려가 버렸다","매달아 놓는다","책을 읽어도 본다","잘난 체를 한다","덤벼들어 보았다"],e:"보조 용언은 띄어 쓰는 것이 원칙이고, ‘본용언+-아/-어+보조 용언’과 ‘의존 명사+-하다/싶다’ 구성은 붙여 쓸 수도 있습니다(깨뜨려버렸다, 올듯하다, 할만하다).\n다만 본용언이 합성어(덤벼들다, 떠내려가다, 매달다)이거나, 앞말에 조사가 붙거나(읽어도), 중간에 조사가 들어가면(체를) 보조 용언을 띄어 씁니다."},

{c:"제1장 총칙",q:"윗글에 대한 이해로 적절하지 않은 것은?",p:"말을 글로 표기하는 방식은 크게 두 가지가 있다. 표음주의는 우리가 발음하는 대로 적는 방식이고, 표의주의는 형태소의 본래 모양을 밝혀 표기하는 방식이다. 소리대로 적는 방식은 표기하기가 용이하고, 형태소의 본래 모양을 밝혀 적는 방식은 읽으면서 그 의미를 파악하기가 편하다는 장점이 있다.",o:["‘밥’, ‘꿈’은 표음주의에 따라 적은 것이다","‘늙어, 늙지, 늙는’은 표의주의를 반영한 표기이다","표음주의는 읽으면서 의미를 파악하기 편하다는 장점이 있다","‘아름답어’로 적지 않는 것은 [아름다버]로 소리 나기 때문이다","제1항은 소리대로 적되 어법에 맞도록 함을 원칙으로 한다"],a:2,e:"의미 파악이 편한 것은 표의주의의 장점이고, 표음주의의 장점은 표기가 쉽다는 것입니다."},

{c:"제3장 소리에 관한 것",q:"<보기>의 단어 중 된소리를 표기에 반영한 것만 고른 것은?",p:"<보기>\nㄱ. 깍두기[깍뚜기]  ㄴ. 소쩍새[소쩍새]\nㄷ. 똑똑하다[똑또카다]  ㄹ. 몹시[몹씨]",o:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄹ","ㄴ, ㄷ, ㄹ"],a:1,e:"소쩍새는 두 모음 사이의 된소리라 소리대로 적고, 똑똑하다는 같은 음절 반복의 예외라 된소리를 반영합니다. 깍두기와 몹시는 ㄱ·ㅂ 받침 뒤 된소리라 표기에 반영하지 않습니다."},
{c:"제3장 소리에 관한 것",q:"위 규정을 적용한 표기로 옳은 것은?",p:"‘ㄷ’ 소리로 나는 받침 중에서 ‘ㄷ’으로 적을 근거가 없는 것은 ‘ㅅ’으로 적는다. 한편 ‘술+가락’처럼 끝소리가 ‘ㄹ’인 말과 다른 말이 어울릴 때 ‘ㄹ’ 소리가 ‘ㄷ’ 소리로 나는 것은 ‘ㄷ’으로 적는다.",o:["돗자리, 숟가락","돋자리, 숟가락","돗자리, 숫가락","덛저고리, 사흗날","웃어른, 사흣날"],a:0,e:"돗자리는 ㄷ으로 적을 근거가 없어 ㅅ으로, 숟가락은 ‘술’의 ㄹ이 ㄷ 소리로 나므로 ㄷ으로 적습니다."},
{c:"제3장 소리에 관한 것",q:"(가)~(다)에 들어갈 말로 알맞은 것은?",p:"<보기>\n(가) 이 쌀은 생산 (  ) 2025년의 것이다.\n(나) 2025(  )에 생산된 쌀이다.\n(다) 강아지를 키운 지 십 (  )이 되었다.",o:["연도, 년도, 년","년도, 연도, 연","연도, 연도, 년","연도, 년도, 연","년도, 년도, 년"],a:0,e:"(가) ‘생산 연도’의 연도는 명사라 두음법칙 적용, (나) ‘2025년도’의 ‘년’은 의존 명사라 두음법칙을 적용하지 않음, (다) 수사 뒤 의존 명사 ‘년’도 마찬가지입니다."},
{c:"제4장 형태에 관한 것",q:"윗글을 바탕으로 판단할 때 적절하지 않은 것은?",p:"한글 맞춤법 제15항 [붙임 1]은 두 개의 용언이 어울려 한 개의 용언이 될 적에, 앞말의 본뜻이 유지되고 있는 것은 그 원형을 밝혀 적고, 그 본뜻에서 멀어진 것은 밝혀 적지 아니한다고 규정한다.",o:["‘늘어나다’는 ‘늘다’의 뜻이 유지되므로 원형을 밝혀 적는다","‘드러나다’는 ‘들다’의 본뜻이 유지되지 않아 소리대로 적는다","이 규정에는 표음주의와 표의주의가 함께 반영되어 있다","‘들어나다’로 적으면 ‘들다’의 의미를 살려 적은 것이므로 옳다","‘늘어나다’를 ‘느러나다’로 적지 않는다"],a:3,e:"‘드러나다’는 ‘들다’의 본뜻에서 멀어졌으므로 ‘들어나다’로 적지 않고 소리 나는 대로 적습니다."},
{c:"제4장 형태에 관한 것",q:"<보기>에 따라 분석한 것으로 옳은 것은?",p:"<보기>\n어간에 ‘-이’나 ‘-음/-ㅁ’이 붙어 명사가 되거나 ‘-이, -히’가 붙어 부사가 된 말은 어간의 원형을 밝혀 적는다. 다만 ‘너머’(넘+어)처럼 ‘-이, -음’ 이외의 모음으로 시작하는 접미사가 결합하여 품사가 바뀐 말은 원형을 밝혀 적지 않는다.",o:["마감 - ‘막-’에 ‘-음’이 붙었으므로 ‘막음’으로 적는다","도로 - ‘돌-’에 ‘-오’가 붙어 품사가 바뀌었으므로 원형을 밝히지 않는다","쓰레기 - ‘쓸-’에 ‘-이’가 붙었으므로 ‘쓸에기’로 적는다","너머 - ‘넘-’에 ‘-이’가 붙었으므로 ‘넘이’로 적는다","베풂 - ‘-이, -음’ 이외의 접미사가 붙어 원형을 밝히지 않는다"],a:1,e:"도로(돌+오)는 ‘-이, -음’ 이외의 모음으로 시작하는 접미사가 붙어 부사가 된 말이라 원형을 밝히지 않습니다. 베풂은 ‘-ㅁ’이 붙은 명사라 원형을 밝혀 적습니다."},
{c:"제4장 형태에 관한 것",q:"<보기>의 ①~③이 적용된 예가 순서대로 짝지어진 것은?",p:"<보기>\n① ‘하’가 통째로 줄지 않고 ‘ㅎ’이 남아 뒤 음절의 첫소리와 어울려 거센소리가 되면 거센소리로 적는다.\n② ‘하’ 앞의 받침이 [ㄱ, ㄷ, ㅂ] 소리일 경우 ‘하’가 통째로 줄어든다.\n③ ‘ㅎ’이 어간의 끝소리로 굳어진 것은 받침으로 적는다.",o:["간편케 - 생각건대 - 어떻다","생각건대 - 간편케 - 어떻다","어떻다 - 간편케 - 생각건대","간편케 - 어떻다 - 생각건대","다정타 - 어떻다 - 못지않다"],a:0,e:"간편케(ㄴ 받침 뒤라 ㅎ이 남음), 생각건대(ㄱ 받침 뒤라 ‘하’ 탈락), 어떻다(어떠하다에서 ㅎ이 어간 끝소리로 굳어짐)입니다."},
{c:"제5장 띄어쓰기",q:"(가)~(라) 중 띄어쓰기가 옳지 않은 것만을 고른 것은?",p:"<보기>\n(가) 그는 처음 본 사람에게도 아는 척을 한다.\n(나) 하늘이 잔뜩 흐린 것이 아무래도 비가 올듯하다.\n(다) 그는 잘못을 사과하기는 커녕 변명을 반복했다.\n(라) 나는 세 번 만에 시험에 합격했다.",o:["(다)","(나), (다)","(가), (다)","(다), (라)","(가), (나), (다)"],a:0,e:"(가) 의존 명사 ‘척’ 뒤에 조사 ‘을’이 붙어 ‘척을 한다’로 띄어 쓰고, (나) ‘의존 명사+-하다’는 ‘올듯하다’로 붙여 쓰는 것이 허용되며, (라) ‘세 번 만에’는 의존 명사라 띄어 씁니다. (다) ‘커녕’은 조사라 ‘사과하기는커녕’으로 붙여 씁니다."},
{c:"제5장 띄어쓰기",q:"윗글의 규정에 따라 띄어쓰기가 옳은 것은?",p:"보조 용언은 띄어 씀을 원칙으로 하되 경우에 따라 붙여 씀도 허용한다. 다만, 앞말에 조사가 붙거나 앞말이 합성 용언인 경우, 그리고 중간에 조사가 들어갈 적에는 그 뒤에 오는 보조 용언은 띄어 쓴다.",o:["덤벼들어 보아라","덤벼들어보아라","책을 읽어도본다","매달아놓는다","잘난체를 한다"],a:0,e:"‘덤벼들다’는 합성 용언이므로 보조 용언 ‘보다’를 띄어 씁니다. ‘읽어도’는 앞말에 조사가 붙었고, ‘매달다’는 합성 용언이며, ‘체를’은 의존 명사 뒤에 조사가 붙은 경우입니다."},
{c:"제6장 그 밖의 것",q:"위 경향성 ㉠~㉥에 해당하는 예가 순서대로 올바르게 짝지어진 것은?",p:"제51항: 부사의 끝음절이 분명히 ‘이’로만 나는 것은 ‘-이’로 적고, ‘히’로만 나거나 ‘이’나 ‘히’로 나는 것은 ‘-히’로 적는다. 경향성: ㉠ 겹쳐 쓰인 명사 뒤 ㉡ ‘ㅅ’ 받침 뒤 ㉢ ‘ㅂ’ 불규칙 용언의 어간 뒤 ㉣ ‘하다’가 붙지 않는 용언 어간 뒤 ㉤ 부사 뒤 ㉥ ‘ㄱ’ 받침으로 끝난 일부 어근 뒤에서는 ‘이’로 적는다.",o:["겹겹이 - 반듯이 - 가벼이 - 헛되이 - 곰곰이 - 깊숙이","겹겹이 - 반듯이 - 가벼이 - 헛되이 - 깊숙이 - 곰곰이","반듯이 - 겹겹이 - 가벼이 - 헛되이 - 곰곰이 - 깊숙이","겹겹이 - 반듯이 - 헛되이 - 가벼이 - 곰곰이 - 깊숙이","겹겹이 - 깨끗이 - 가벼이 - 곰곰이 - 헛되이 - 깊숙이"],a:0,e:"겹겹이(겹쳐 쓰인 명사), 반듯이(ㅅ 받침), 가벼이(ㅂ 불규칙), 헛되이(‘하다’가 붙지 않는 용언), 곰곰이(부사), 깊숙이(ㄱ 받침 어근)입니다."}
];
const cats=[...new Set([...R,...P].map(x=>x.c))];
let sel=new Set(cats),N=20,S={};
const $=document.getElementById("app");
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pk=(a,n)=>sh(a).slice(0,n),pw=s=>s.split(">");
function gen(r){
const ms=[];if(r.B.length>=4)ms.push("y");if(r.A.length>=4)ms.push("n");
const m=ms[Math.random()*ms.length|0];let ans,ds,qq;
if(m==="y"){ans=pk(r.A,1)[0];ds=pk(r.B.filter(b=>pw(b)[1]!==ans),4);qq=r.y}
else{ans=pk(r.B,1)[0];const f=pw(ans)[1];ds=pk(r.A.filter(a=>a!==f),4);qq=r.n}
const o=[ans,...ds];
return{c:r.c,q:"["+r.h+"] "+qq,o:o.map(x=>pw(x)[0]),a:0,e:r.e+"\n\n"+o.map(x=>r.A.includes(x)?"○ "+x:"✗ "+pw(x)[0]+(pw(x)[1]?" → "+pw(x)[1]:"")).join("\n")};
}
function build(){
const rs=R.filter(r=>sel.has(r.c)),ps=sh(P.filter(p=>sel.has(p.c))),out=[];let pi=0;
for(let i=0;i<N;i++){
if(pi<ps.length&&(Math.random()<.4||!rs.length))out.push(ps[pi++]);
else if(rs.length)out.push(gen(rs[Math.random()*rs.length|0]));else break}
return sh(out);
}
function home(){
$.innerHTML=`<h1>한글 맞춤법 고난도 연습</h1><p class="s">풀 때마다 문제와 선택지가 새로 만들어집니다. 규칙 문제와 지문·보기형 문제가 섞여 나옵니다.</p>
<h2>유형 선택</h2><div class="chips">${cats.map(c=>`<button class="chip ${sel.has(c)?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
<button class="chip" id="all" style="margin-top:10px">전체 선택/해제</button>
<h2>문항 수</h2><div class="chips">${[10,20,30].map(n=>`<button class="chip ${N===n?"on":""}" data-n="${n}">${n}문항</button>`).join("")}</div>
<button class="btn" id="go">시작하기</button>`;
$.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{sel.has(b.dataset.c)?sel.delete(b.dataset.c):sel.add(b.dataset.c);home()});
$.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{N=+b.dataset.n;home()});
document.getElementById("all").onclick=()=>{sel=sel.size?new Set():new Set(cats);home()};
document.getElementById("go").onclick=()=>{const l=build();if(l.length)start(l)};
}
function start(list){S={list,i:0,ok:0,wrong:[]};show()}
function show(){
const q=S.list[S.i],n=S.list.length,ord=sh(q.o.map((t,k)=>k));
$.innerHTML=`<div class="bar"><i style="width:${S.i/n*100}%"></i></div><div class="card"><span class="tag">${q.c} · ${S.i+1}/${n}</span>${q.p?`<div class="bo">${q.p}</div>`:""}<div class="q">${q.q}</div>
${ord.map((k,j)=>`<button class="o" data-k="${k}">${"①②③④⑤"[j]} ${q.o[k]}</button>`).join("")}<div id="fb"></div></div>`;
$.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
const k=+b.dataset.k,right=k===q.a;
$.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("ok")});
if(!right)b.classList.add("no");
right?S.ok++:S.wrong.push(q);
document.getElementById("fb").innerHTML=`<div class="ex"><b>${right?"정답입니다":"오답입니다"}</b>\n${q.e}</div><button class="btn" id="nx">${S.i+1<n?"다음 문제":"결과 보기"}</button>`;
document.getElementById("nx").onclick=()=>{S.i++;S.i<n?show():res()}});
}
function res(){
const n=S.list.length;
$.innerHTML=`<h1>결과</h1><div class="big">${S.ok} / ${n}</div>
${S.wrong.length?`<h2>틀린 문제</h2>${S.wrong.map(q=>`<div class="card"><span class="tag">${q.c}</span>${q.p?`<div class="bo">${q.p}</div>`:""}<div class="q">${q.q}</div><div class="ex">정답: ${q.o[q.a]}\n${q.e}</div></div>`).join("")}<button class="btn" id="rt">틀린 문제만 다시 풀기</button>`:`<p class="s" style="text-align:center">모두 맞혔어요!</p>`}
<button class="btn g" id="ag">새 문제로 다시 풀기</button><button class="btn g" id="hm">처음으로</button>`;
const r=document.getElementById("rt");if(r)r.onclick=()=>start(sh(S.wrong));
document.getElementById("ag").onclick=()=>{const l=build();if(l.length)start(l)};
document.getElementById("hm").onclick=home;
}
home();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("오프라인 저장 등록 실패:", err));
  });
}
</script>
